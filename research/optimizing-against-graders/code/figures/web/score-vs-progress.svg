<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 536" width="680" height="536" role="img" aria-labelledby="t d"><title id="t">Batch 2: score and real progress climb together</title><desc id="d">Batch 2: score and real progress climb together, with the visited-squares observation. Top: proxy score P per checkpoint for the proxy-trained agent (A0), the oracle-trained agent (A2&#x27;&#x27;) and random play. Bottom: true progress T (milestones reached). Trained and tested from the first start state (Oak&#x27;s Lab, Squirtle), 5 seeds each, 8 test episodes per seed per checkpoint; band = 95% CI over seeds.</desc><style>
