<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 568" width="640" height="568" role="img" aria-labelledby="t d"><title id="t">The route: Oak&#x27;s Lab to Viridian Forest</title><desc id="d">Schematic of the game segment the agents play, bottom to top: start in Oak&#x27;s Lab in Pallet Town, Route 1, Viridian City (milestone 1), Route 2 (milestone 2), Viridian Forest (milestone 3). Route 22 branches west off Viridian City and is a dead end.</desc><style>
