<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 552" width="680" height="552" role="img" aria-labelledby="t d"><title id="t">Where the score came from, before and after the patch</title><desc id="d">Three bar charts. (a) What earned each agent&#x27;s own score: almost all exploring before the patch; exploring plus about 12 percent levelling up after it. (b) Share of the original score earned on off-route maps: about 17 percent before the patch, about 17 percent after it, 12 percent for random play. (c) Share of each agent&#x27;s own score earned while grinding battles: 0 before, 22 percent after.</desc><style>
